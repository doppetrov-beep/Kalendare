<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Сбор пати — новый адрес</title>
  <script>
    (() => {
      'use strict';
      // Preserve existing invite links: both room ID and secret invitation code.
      // Never send the old URL as the HTTP Referer.
      const destination = new URL('https://doppetrov-beep.github.io/-DND-Party/');
      destination.search = window.location.search;
      destination.hash = window.location.hash;
      window.location.replace(destination.href);
    })();
  </script>
  <style>
    body {font:16px/1.5 system-ui,-apple-system,sans-serif;background:#111827;color:#ecf0f7;margin:0;padding:32px 20px;}
    main {max-width:500px;margin:15vh auto;}
    h1 {font-size:28px;}
    a {color:#ebc67b;overflow-wrap:anywhere;}
  </style>
</head>
<body>
  <main>
    <h1>⚔ Сбор пати переехал</h1>
    <p>Теперь наш D&D-календарь работает на отдельном сайте. Перенаправляем туда автоматически.</p>
    <p><a id="newSite" href="https://doppetrov-beep.github.io/-DND-Party/" referrerpolicy="no-referrer">Открыть новый D&D-календарь</a></p>
    <noscript><p>Для автоматического сохранения параметров приглашения включи JavaScript.</p></noscript>
  </main>
  <script>
    (() => {
      const destination = new URL('https://doppetrov-beep.github.io/-DND-Party/');
      destination.search = window.location.search;
      destination.hash = window.location.hash;
      document.getElementById('newSite').href = destination.href;
    })();
  </script>
</body>
</html>
