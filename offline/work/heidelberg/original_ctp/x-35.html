<H1>
<A NAME="50442902_pgfId-1020703"></A>Configuration</H1>
<P>
<A NAME="50442902_pgfId-1020704"></A>In this tab, you can choose the interface to the online processor. The serial interface and Ethernet are available.</P>
<P>
<A NAME="50442902_pgfId-1020705"></A>The IP address of the online processor and the port number are specified for Ethernet.</P>
