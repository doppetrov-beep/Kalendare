name = "kalendare-sync"
main = "worker.mjs"
compatibility_date = "2026-11-26"
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*", "/work", "/work/*"]

[[durable_objects.bindings]]
name = "SYNC"
class_name = "DiskSync"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DiskSync"]

[build]
command = "python build.py"


[[ratelimits]]
name = "LOGIN_LIMIT"
namespace_id = "1101"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "SYNC_LIMIT"
namespace_id = "1102"
simple = { limit = 30, period = 60 }
[secrets]
required = ["AUTH_SECRET", "ACCOUNTS", "DISK_TOKEN"]
